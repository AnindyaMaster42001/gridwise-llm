name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # ALLOW_NO_LLM keeps CI offline; the deployed service must not set it.
      - run: ALLOW_NO_LLM=1 python -m pytest -q

services:
  gridwise:
    build: .
    image: gridwise-llm:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    environment:
      PORT: "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
